[package]
name = "app"
version = "0.4.1"
description = "A Tauri App"
authors = ["you"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.77.2"
# Disambiguate which binary `tauri build` should bundle. Without this,
# the second binary (`shogun-mcp`) makes Tauri's CLI fail with
# "failed to find main binary, make sure you have a `package > default-run`".
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
log = "0.4"
directories = "5"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
tiny_http = "0.12"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
dotenvy = "0.15"
urlencoding = "2"
url = "2"
open = "5"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
futures = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
cpal = "0.15.3"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rmcp = { version = "0.8", features = ["server", "transport-io", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
lru = "0.12"

[dev-dependencies]
mockito = "1"
testing_logger = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
rfd = "0.15"
core-foundation = "0.10"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
screencapturekit = "6.0.1"

[[bin]]
name = "shogun-mcp"
path = "src/bin/shogun_mcp.rs"
