# SHOGUN Mirror Server configuration example.
# Copy to mirror-server.toml and edit as needed.
# All settings can also be overridden with SHOGUN_MIRROR__<SECTION>__<KEY> env vars.

[server]
# Main HTTP listen address.
listen_addr = "127.0.0.1:8443"
# Prometheus metrics endpoint (no auth; restrict to internal network in production).
metrics_addr = "127.0.0.1:9090"

[storage]
backend = "local_disk"
# Where blobs, index files, and device records are stored.
data_dir = "/var/lib/shogun-mirror"

[auth]
# Single static registration code for self-hosted MVP.
# Rotate this after each device registration, or share it only with trusted users.
# Override with: SHOGUN_MIRROR__AUTH__REGISTRATION_CODE=<code>
registration_code = "change-me-before-use"
# Stable per-instance account identifier (arbitrary string).
account_id = "default-account"

# Optional TLS (for direct rustls mode; omit for reverse-proxy mode).
# [tls]
# cert_path = "/etc/letsencrypt/live/example.com/fullchain.pem"
# key_path  = "/etc/letsencrypt/live/example.com/privkey.pem"

[reaper]
# How often to run the tombstone reaper (seconds). Default: 1 hour.
interval_seconds = 3600
# How long to retain tombstone records before hard-purging (days). Default: 30.
tombstone_retention_days = 30

[ratelimit]
# Per-device rate limits (tokens per window).
post_blobs_per_minute = 100
post_blobs_per_day    = 10000
get_list_per_minute   = 60
get_blob_per_minute   = 600
