# macOS build + GitHub Release. Signed when Apple secrets are present;
# falls back to unsigned (Gatekeeper warning on first launch) otherwise.
#
# Triggers:
#   - push: tag `v*`   → tauri-action creates a draft Release with DMG
#                        (+ updater `latest.json` once the updater plugin
#                        lands; env vars below are harmless until then).
#   - workflow_dispatch → build only, DMG uploaded as artifact.
#
# See docs/macos-release.md §7 for required secrets to enable signing.
name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Signing mode
        id: signing
        run: |
          if [ -n "${APPLE_CERTIFICATE}" ]; then
            echo "mode=signed" >> "${GITHUB_OUTPUT}"
            echo "::notice::Signed build — APPLE_CERTIFICATE is set, Tauri will use Developer ID identity."
          else
            echo "mode=unsigned" >> "${GITHUB_OUTPUT}"
            echo "::warning::Unsigned build — APPLE_CERTIFICATE not set. DMG will trigger Gatekeeper warning on first launch (right-click → Open to bypass). See docs/macos-release.md §7 to enable signing."
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: App Store Connect API key for notarization (optional, signed mode only)
        if: steps.signing.outputs.mode == 'signed'
        env:
          P8_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${P8_B64}" ] || [ -z "${KEY_ID}" ] || [ -z "${ISSUER}" ]; then
            echo "Notarization secrets not all set (APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER) — Tauri will sign only; add secrets to enable notarytool via Tauri."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/apple-asc"
          echo "${P8_B64}" | base64 -d > "${RUNNER_TEMP}/apple-asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/apple-asc/AuthKey.p8"
          {
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/apple-asc/AuthKey.p8"
            echo "APPLE_API_KEY=${KEY_ID}"
            echo "APPLE_API_ISSUER=${ISSUER}"
          } >> "${GITHUB_ENV}"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tag push → build + draft GitHub Release (DMG attached; latest.json
      # attaches automatically once the updater plugin is enabled).
      - name: Build bundles + draft Release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Shogun AI ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ${{ steps.signing.outputs.mode == 'unsigned' && '⚠️ **Unsigned build.** macOS will show "Apple could not verify..." on first launch. Right-click the app → **Open** to bypass Gatekeeper (or System Settings → Privacy & Security → Open Anyway).' || '' }}
          includeUpdaterJson: true

      # workflow_dispatch → build only, no Release side-effects.
      - name: Build bundles (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:desktop
        timeout-minutes: 45

      - name: Upload DMG artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: shogun-macos-dmg-${{ steps.signing.outputs.mode }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
