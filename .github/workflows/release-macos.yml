# macOS build + GitHub Release. Signed when Apple secrets are present;
# falls back to unsigned (Gatekeeper warning on first launch) otherwise.
#
# Triggers:
#   - push: tag `v*`   → draft Release with DMG
#   - workflow_dispatch → build only, DMG uploaded as artifact.
#
# See docs/macos-release.md §7 for required secrets to enable signing.
name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${APPLE_CERTIFICATE}" ]; then
            echo "mode=signed" >> "${GITHUB_OUTPUT}"
            echo "::notice::Signed build — APPLE_CERTIFICATE is set, Tauri will use Developer ID identity."
          else
            echo "mode=unsigned" >> "${GITHUB_OUTPUT}"
            echo "::warning::Unsigned build — APPLE_CERTIFICATE not set. DMG will trigger Gatekeeper warning on first launch (right-click → Open to bypass). See docs/macos-release.md §7 to enable signing."
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Test gate (typecheck + unit)
        # Audit F-5: the release workflow ran zero tests before building the DMG.
        # Typecheck + frontend unit tests are a fast, clang-independent gate that
        # blocks shipping a broken build. (Full rust/e2e run in ci.yml on PRs.)
        run: |
          npm run typecheck
          npm run test:unit

      - name: App Store Connect API key for notarization (optional, signed mode only)
        if: steps.signing.outputs.mode == 'signed'
        env:
          P8_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${P8_B64}" ] || [ -z "${KEY_ID}" ] || [ -z "${ISSUER}" ]; then
            echo "Notarization secrets not all set (APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER) — Tauri will sign only; add secrets to enable notarytool via Tauri."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/apple-asc"
          echo "${P8_B64}" | base64 -d > "${RUNNER_TEMP}/apple-asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/apple-asc/AuthKey.p8"
          {
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/apple-asc/AuthKey.p8"
            echo "APPLE_API_KEY=${KEY_ID}"
            echo "APPLE_API_ISSUER=${ISSUER}"
          } >> "${GITHUB_ENV}"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Sync web-dist bundle
        if: steps.signing.outputs.mode == 'unsigned'
        run: npm run build:web-dist

      # Signed tag push → tauri-action (imports cert, notarizes when configured).
      - name: Build bundles + draft Release (tag push, signed)
        if: >-
          steps.signing.outputs.mode == 'signed'
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Shogun AI ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Unsigned tag push → plain tauri build + gh-release (tauri-action always
      # attempts keychain import when Apple env vars are present, even if empty).
      # When TAURI_SIGNING_PRIVATE_KEY is set, also produce auto-update artifacts
      # (.app.tar.gz + minisign .sig — independent of Apple code signing) so LP
      # installs update themselves on the next release.
      - name: Build unsigned bundles (tag push)
        if: >-
          steps.signing.outputs.mode == 'unsigned'
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::notice::Updater signing key present — building with auto-update artifacts."
            npm run build:desktop -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — auto-update artifacts skipped (installs must re-download from the LP)."
            npm run build:desktop
          fi
        timeout-minutes: 45

      - name: Generate updater manifest (latest.json)
        if: >-
          steps.signing.outputs.mode == 'unsigned'
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_UPDATER_KEY}" != "true" ]; then
            echo "No updater key — skipping latest.json."
            exit 0
          fi
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz | head -1)"
          SIG="${TARBALL}.sig"
          # GitHub replaces spaces in asset names with dots on upload.
          ASSET="$(basename "$TARBALL" | tr ' ' '.')"
          python3 - "$VERSION" "$SIG" "$ASSET" <<'PY'
          import json, sys, datetime, pathlib
          version, sig_path, asset = sys.argv[1:4]
          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": pathlib.Path(sig_path).read_text().strip(),
                      "url": f"https://github.com/Torutesu/ShogunAI3/releases/download/v{version}/{asset}",
                  }
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish unsigned draft Release (tag push)
        if: >-
          steps.signing.outputs.mode == 'unsigned'
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Shogun AI ${{ github.ref_name }}
          body: |
            ⚠️ **Unsigned build.** macOS will show "Apple could not verify..." on first launch. Right-click the app → **Open** to bypass Gatekeeper (or System Settings → Privacy & Security → Open Anyway).
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            latest.json

      # workflow_dispatch → build only, no Release side-effects.
      - name: Build bundles (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm run build:desktop
        timeout-minutes: 45

      - name: Upload DMG artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: shogun-macos-dmg-${{ steps.signing.outputs.mode }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
