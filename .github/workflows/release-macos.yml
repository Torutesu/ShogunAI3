# Manual signed macOS build. Requires repository secrets (see docs/macos-release.md §7).
name: Release macOS (signed)

on:
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Developer ID .p12 secret
        run: |
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "::error::Set repository secret APPLE_CERTIFICATE (base64-encoded .p12 export of your Developer ID Application certificate + private key). See docs/macos-release.md §7."
            exit 1
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: App Store Connect API key for notarization (optional)
        env:
          P8_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${P8_B64}" ] || [ -z "${KEY_ID}" ] || [ -z "${ISSUER}" ]; then
            echo "Notarization secrets not all set (APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER) — Tauri will sign only; add secrets to enable notarytool via Tauri."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/apple-asc"
          echo "${P8_B64}" | base64 -d > "${RUNNER_TEMP}/apple-asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/apple-asc/AuthKey.p8"
          {
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/apple-asc/AuthKey.p8"
            echo "APPLE_API_KEY=${KEY_ID}"
            echo "APPLE_API_ISSUER=${ISSUER}"
          } >> "${GITHUB_ENV}"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build signed bundles (Tauri)
        run: npm run build:desktop

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: shogun-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
