name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Circular dependency check (madge)
        run: npm run cycles

      - name: Unused code check (knip)
        run: npm run knip

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Action wiring check
        run: npm run check:actions

      - name: OAuth helper syntax check
        run: node --check scripts/oauth-google.mjs

      - name: OAuth helper help smoke
        run: node scripts/oauth-google.mjs --help

      - name: Cargo check (Tauri / Rust)
        run: npm run check:rust

      - name: Cargo test (Tauri / Rust)
        run: |
          SWIFT_LIB=$(find src-tauri/target/debug/build/screencapturekit-*/out/swift-build -name 'libswift_Concurrency.dylib' -print -quit)
          if [ -n "$SWIFT_LIB" ]; then
            SWIFT_DIR=$(dirname "$SWIFT_LIB")
            for dest in src-tauri/target/debug src-tauri/target/debug/deps; do
              mkdir -p "$dest"
              cp -f "$SWIFT_DIR"/*.dylib "$dest/" 2>/dev/null || true
            done
          fi
          npm run test:rust

      - name: Sync web-dist bundle
        run: npm run build:web-dist

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Tauri production build (bundle)
        run: npm run build:desktop
        timeout-minutes: 45
