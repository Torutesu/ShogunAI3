name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select working clang toolchain
        # The macos-latest runner's default Xcode (26.x beta) has a broken
        # xcodebuild: `cc` invokes `xcodebuild -find clang` during linking, which
        # aborts (Abort trap: 6) with "Failed to locate 'clang'", failing
        # `cargo test` while building proc-macro deps (phf_macros). clang itself
        # works — only the xcodebuild lookup crashes. Prefer a stable Xcode if the
        # runner has one; otherwise fall back to the standalone Command Line Tools,
        # whose clang driver does not shell out to the broken xcodebuild.
        run: |
          set -x
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          stable="$(ls -d /Applications/Xcode_1*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$stable" ]; then
            sudo xcode-select -s "$stable"
          elif [ -d /Library/Developer/CommandLineTools ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
          fi
          xcode-select -p
          clang --version
          # Prove the linker's clang lookup no longer aborts.
          cc -x c -o /tmp/cc_probe - <<<'int main(void){return 0;}'
          echo "cc link probe OK"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Circular dependency check (madge)
        run: npm run cycles

      - name: Unused code check (knip)
        run: npm run knip

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Action wiring check
        run: npm run check:actions

      - name: Web app tests (vitest)
        # Audit F-5: the Next.js web app (Stripe webhook / entitlement / invites /
        # waitlist) was never exercised in CI. Node-only, no clang dependency.
        run: |
          npm ci --prefix web
          npm run test --prefix web

      - name: OAuth helper syntax check
        run: node --check scripts/oauth-google.mjs

      - name: OAuth helper help smoke
        run: node scripts/oauth-google.mjs --help

      - name: Cargo check (Tauri / Rust)
        run: npm run check:rust

      - name: Cargo test (Tauri / Rust)
        run: |
          SWIFT_LIB=$(find src-tauri/target/debug/build/screencapturekit-*/out/swift-build -name 'libswift_Concurrency.dylib' -print -quit)
          if [ -n "$SWIFT_LIB" ]; then
            SWIFT_DIR=$(dirname "$SWIFT_LIB")
            for dest in src-tauri/target/debug src-tauri/target/debug/deps; do
              mkdir -p "$dest"
              cp -f "$SWIFT_DIR"/*.dylib "$dest/" 2>/dev/null || true
            done
          fi
          XCODE_SWIFT=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.5/macosx
          export DYLD_LIBRARY_PATH="$XCODE_SWIFT:src-tauri/target/debug:src-tauri/target/debug/deps:${DYLD_LIBRARY_PATH:-}"
          npm run test:rust

      - name: Cargo test (mirror-server)
        # Audit F-5: the E2E-encryption reference server (crypto + HTTP protocol)
        # was never run in CI. Composes with the runner's clang toolchain fix.
        run: cargo test --manifest-path mirror-server/Cargo.toml --locked

      - name: Sync web-dist bundle
        run: npm run build:web-dist

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Tauri production build (bundle)
        run: npm run build:desktop
        timeout-minutes: 45
