name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Action wiring check
        run: npm run check:actions

      - name: IPC mock sync check
        run: npm run check:ipc-mock

      - name: Cargo check (Tauri / Rust)
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --color=never 2>&1 | tee /tmp/cargo-check.log
        shell: bash

      - name: Upload cargo check log on failure
        if: failure()
        run: |
          if [ -f /tmp/cargo-check.log ]; then
            echo "::group::cargo check output"
            cat /tmp/cargo-check.log
            echo "::endgroup::"
            # Emit each rustc error line as a workflow annotation so it
            # shows up under `check-runs/{id}/annotations` (log download
            # needs admin; annotations do not).
            grep -E '^error(\[E[0-9]+\])?: ' /tmp/cargo-check.log | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
        shell: bash

      - name: Sync web-dist bundle
        run: npm run build:web-dist

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Tauri production build (bundle)
        run: npm run build:desktop
        timeout-minutes: 45

      - name: Verify amc-pipeline bundling
        run: node scripts/check-bundle-amc.mjs
